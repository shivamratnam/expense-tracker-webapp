<div class="container">
    <div class="logo">
        <mat-icon class="logo-element">shopping_bag</mat-icon>
        <span class="logo-element">Expense Tracker</span>
    </div>

    <div class="box">
        <div class="title">
            <h1>Login</h1>
        </div>
        <div class="content">
            <form [formGroup]="loginForm">
                <mat-form-field appearance="outline">
                    <input matInput formControlName="username" placeholder="Username">
                    @if (loginForm.controls.username.touched && loginForm.controls.username.errors) {
                        <mat-error>Username is required</mat-error>
                    }
                </mat-form-field>
    
                <mat-form-field appearance="outline">
                    <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" placeholder="Password"/>
                    <button mat-icon-button matSuffix
                    (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide()">
                        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    @if (loginForm.controls.password.touched && loginForm.controls.password.errors) {
                        <mat-error>Password is required</mat-error>
                    }
                </mat-form-field>
            </form>
            <button mat-flat-button class="login-btn" (click)="onLogin()" [disabled]="isInvalidForm()">Login</button>
            <hr>
            <p>Don't have an account? <a class="signup-link" href="/signup">Create now.</a></p>
        </div>
    </div>
</div>
